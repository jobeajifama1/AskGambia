[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gambia-legal-chatbook"
version = "2.0.0"
description = "A source-grounded AI legal information chatbook for Gambian laws, Acts and policies."
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "pypdf>=4.0", "streamlit>=1.36"]

[project.scripts]
gambia-law-chatbot = "gambia_law_chatbot.cli:main"

[tool.setuptools]
packages = ["gambia_law_chatbot"]
